<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Summary — DisciplineBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="bg-particles">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
</div>

<header class="header">
    <div class="header-inner">
        <div class="logo">
            <div class="logo-icon">🤖</div>
            <div class="logo-text">
                <span class="logo-name">DisciplineBot</span>
                <span class="logo-tagline">Daily Performance Report</span>
            </div>
        </div>
        <a href="/" class="btn btn-ghost">← Back to Dashboard</a>
    </div>
</header>

<main class="main">
    <section class="summary-hero">
        <div class="summary-grade-card">
            <div class="summary-date" th:text="${summary.date}">Date</div>
            <div class="big-grade"
                 th:text="${summary.overallGrade}"
                 th:classappend="'grade-' + ${summary.overallGrade}">S</div>
            <div class="big-grade-label">PERFORMANCE GRADE</div>
            <div class="summary-stats-row">
                <div class="sum-stat">
                    <span class="sum-stat-num" th:text="${summary.completedHabits}">0</span>
                    <span class="sum-stat-label">Completed</span>
                </div>
                <div class="sum-stat">
                    <span class="sum-stat-num" th:text="${summary.missedHabits}">0</span>
                    <span class="sum-stat-label">Missed</span>
                </div>
                <div class="sum-stat">
                    <span class="sum-stat-num" th:text="${#numbers.formatDecimal(summary.completionPercentage, 1, 0)} + '%'">0%</span>
                    <span class="sum-stat-label">Score</span>
                </div>
            </div>
        </div>
    </section>

    <!-- AI Coach Message -->
    <section class="coach-message-section">
        <div class="coach-message-card">
            <div class="coach-label">🤖 STRICT COACH SAYS:</div>
            <div class="coach-message" th:text="${summary.aiMotivationalMessage}">Loading...</div>
        </div>
    </section>

    <!-- Habit Breakdown -->
    <section class="habits-section">
        <h2 class="section-title"><span>📋</span> Habit Breakdown</h2>
        <div class="summary-habits-list">
            <div th:each="hs : ${summary.habitStatuses}"
                 class="summary-habit-row"
                 th:classappend="${hs.completed} ? 'summary-done' : (${hs.status == 'PARTIAL'} ? 'summary-partial' : 'summary-missed')">
                <div class="sum-habit-emoji" th:text="${hs.emoji}">💧</div>
                <div class="sum-habit-details">
                    <div class="sum-habit-name" th:text="${hs.habitName}">Habit</div>
                    <div class="sum-habit-progress" th:text="${hs.completionCount} + ' / ' + ${hs.targetCount} + ' done'">0/1 done</div>
                </div>
                <div class="sum-habit-right">
                    <div class="sum-habit-streak" th:if="${hs.streak > 0}">🔥 <span th:text="${hs.streak}">0</span>d</div>
                    <div class="sum-status-badge"
                         th:text="${hs.status}"
                         th:classappend="${hs.status == 'DONE'} ? 'badge-done' : (${hs.status == 'PARTIAL'} ? 'badge-partial' : 'badge-missed')">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="summary-actions">
        <button class="btn btn-primary" onclick="sendSummaryNow()">📤 Send to WhatsApp</button>
        <a href="/" class="btn btn-ghost">← Dashboard</a>
    </div>
</main>

<script src="/js/app.js"></script>
</body>
</html>
